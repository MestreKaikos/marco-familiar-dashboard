<!doctype html>
<html lang="ca">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font:16px system-ui}
video{width:100%;height:100%;object-fit:contain}
#status{position:absolute;left:1rem;right:1rem;bottom:1rem;text-align:center}
</style>
<video id="video" autoplay playsinline muted></video>
<div id="status" role="status">Connectant amb Google Nest…</div>
<script>
const cameraKey = '__NEST_KEY__';
const device = '__NEST_DEVICE__';
const video = document.getElementById('video');
const status = document.getElementById('status');
let peer, session, timer, videoTimeout, closed = false;

async function call(body, keepalive = false) {
  const response = await fetch('/api/nest', {
    method: 'POST', cache: 'no-store', keepalive,
    headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + cameraKey},
    body: JSON.stringify(body)
  });
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'No s’ha pogut obrir el directe.');
  return result;
}

function end(message) {
  closed = true;
  clearTimeout(timer);
  clearTimeout(videoTimeout);
  if (peer) peer.close();
  video.srcObject = null;
  if (session) {
    call({action:'stop', session}, true).catch(() => {});
    session = null;
  }
  if (message) status.textContent = message;
}
window.endNestStream = () => end();
window.addEventListener('pagehide', window.endNestStream);
video.onplaying = () => { clearTimeout(videoTimeout); status.textContent = ''; };

async function start() {
  try {
    peer = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    const stream = new MediaStream();
    video.srcObject = stream;
    peer.ontrack = event => { stream.addTrack(event.track); video.play().catch(() => {}); };
    peer.addTransceiver('audio', {direction:'recvonly'});
    peer.addTransceiver('video', {direction:'recvonly'});
    peer.createDataChannel('data');
    await peer.setLocalDescription(await peer.createOffer());
    await new Promise(resolve => {
      const check = () => { if (peer.iceGatheringState === 'complete') resolve(); };
      peer.addEventListener('icegatheringstatechange', check);
      setTimeout(resolve, 4000);
      check();
    });
    if (closed) return;
    const result = await call({action:'start', device, sdp:peer.localDescription.sdp});
    session = result.session;
    if (closed) { end(); return; }
    videoTimeout = setTimeout(() => end('No ha arribat vídeo. Tanca el directe i torna-ho a provar.'), 20000);
    await peer.setRemoteDescription({type:'answer', sdp:result.answerSdp});
    timer = setTimeout(() => end('Prova finalitzada. Tanca i torna a obrir per veure el directe.'), 90000);
  } catch (error) {
    if (!closed) end(error.message);
  }
}
start();
</script>
</html>
