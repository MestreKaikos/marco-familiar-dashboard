<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1d2939;background:#f6f8fa}
body{margin:0;padding:24px 16px}main{max-width:540px;margin:auto}h1{font-size:1.8rem;margin:18px 0 8px}
p{line-height:1.5;color:#586174}.card{background:white;border-radius:20px;padding:22px;box-shadow:0 4px 24px #0001}
label{font-weight:650;display:block;margin:20px 0 8px}input{box-sizing:border-box;width:100%;font:inherit;border-radius:12px;border:1px solid #cbd5e1;padding:12px}
button{width:100%;border:0;border-radius:12px;background:#254c67;color:white;font:inherit;font-weight:700;padding:15px;margin-top:20px;cursor:pointer}
button:disabled{opacity:.55}#preview{max-height:280px;object-fit:contain;width:100%;display:none;margin:16px auto;border-radius:10px}
small{color:#566}#status{margin-top:12px;min-height:28px} .ok{color:#176c46}.bad{color:#ae2931}
</style></head><body><main><h1>📸 Fotografies de la família</h1>
<p>Selecciona una imatge del mòbil per afegir-la a la carpeta privada del Marc Familiar.</p>
<div class="card"><label for="key">Clau familiar de pujada</label>
<input id="key" type="password" autocomplete="off" placeholder="Introdueix la clau privada" required>
<small>Per seguretat, no es desa la clau al navegador.</small>
<label for="file">Fotografia (JPG, PNG o WebP; màxim 5 MB)</label>
<input id="file" type="file" accept="image/jpeg,image/png,image/webp" required>
<img id="preview" alt="Vista prèvia de la foto seleccionada">
<button id="send" type="button">Enviar al marc</button><div id="status" aria-live="polite"></div>
</div></main>
<script>
const file=document.getElementById('file'), preview=document.getElementById('preview'), btn=document.getElementById('send'),status=document.getElementById('status');
file.addEventListener('change',()=>{
  if(preview.dataset.url) URL.revokeObjectURL(preview.dataset.url);
  const f=file.files[0];preview.style.display=f?'block':'none';
  if(f){const url=URL.createObjectURL(f);preview.dataset.url=url;preview.src=url;}
});
btn.addEventListener('click',async()=>{
 const f=file.files[0],key=document.getElementById('key').value;
 status.className='';if(!f||!key){status.textContent='Tria una foto i introdueix la clau.';return;}
 if(f.size>5*1024*1024){status.textContent='La foto supera els 5 MB.';return;}
 btn.disabled=true;status.textContent='Enviant fotografia…';
 try{
  const base64=await new Promise((resolve,reject)=>{
   const reader=new FileReader();reader.onerror=()=>reject(new Error('No es pot llegir la foto.'));
   reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.readAsDataURL(f);
  });
  google.script.run.withSuccessHandler(()=>{
    status.className='ok';status.textContent='Fotografia enviada correctament!';
    file.value='';preview.style.display='none';btn.disabled=false;
  }).withFailureHandler(err=>{
    status.className='bad';status.textContent=err.message||'Error en enviar la foto.';btn.disabled=false;
  }).uploadPhoto({key,name:f.name,mime:f.type,base64});
 }catch(err){status.className='bad';status.textContent=err.message;btn.disabled=false;}
});
</script></body></html>
