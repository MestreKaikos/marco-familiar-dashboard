# Marco familiar: dentro del bloque server { … } (HTTPS) del dominio del servidor.
# <RUTA-SECRETA>: cadena aleatoria larga (p. ej. `openssl rand -hex 16`), la misma que en calendarios.properties.
server {
    listen 443 ssl;
    http2 on;
    server_name familia.example.com;
    # ssl_certificate / ssl_certificate_key: los de tu certificado (p. ej. Let's Encrypt)

    # Solo la lista de la compra (solo lectura) en una ruta secreta; sin registro de accesos.
    location = /familia/<RUTA-SECRETA>/compra.json {
        alias /srv/familia/publico/compra.json;
        default_type application/json;
        add_header Cache-Control "no-store";
        access_log off;
    }
    # Tareas de los niños, compra y casa (tareas_api.py): además de la ruta, cabecera X-Marco con el token del marco.
    location /familia/<RUTA-SECRETA>/tareas/ {
        proxy_pass http://127.0.0.1:8124/;
        proxy_set_header Host $host;
        client_max_body_size 4k;
        add_header Cache-Control "no-store";
        access_log off;
    }
    # Nada más de /familia/ es público
    location /familia/ {
        return 404;
    }
}
