name: Sincronització familiar · Proves

on:
  pull_request:
    paths:
      - "sync/**"
      - ".github/workflows/sync-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comprova JavaScript del servidor
        run: |
          cp sync/google-apps-script/Code.gs /tmp/marc-familiar-script.js
          node --check /tmp/marc-familiar-script.js
      - name: Executa proves de la compra i dels sopars sense dades reals
        run: node sync/google-apps-script/test.js
      - name: Comprova el JavaScript de la pàgina mòbil
        run: |
          python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path("sync/google-apps-script/Mobile.html").read_text()
          match = re.search(r"<script>(.*?)</script>", src, re.S)
          assert match, "Falta l'script de la pàgina mòbil"
          pathlib.Path("/tmp/marc-familiar-mobile.js").write_text(match.group(1))
          PY
          node --check /tmp/marc-familiar-mobile.js
