name: Android · Compilació

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixa el codi
        uses: actions/checkout@v4
      - name: Configura Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configura Android SDK
        uses: android-actions/setup-android@v3
      - name: Instal·la la plataforma Android
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compila la versió debug
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
