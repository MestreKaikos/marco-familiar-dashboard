name: Android · Compilació

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# Només compilar l'últim canvi del PR per estalviar minuts de GitHub Actions.
concurrency:
  group: android-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixa el codi
        uses: actions/checkout@v4
      - name: Configura Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Configura Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: "false"
      - name: Instal·la la plataforma Android
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Configura Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepara la clau estable de signatura
        env:
          KEYSTORE_B64: ${{ secrets.MARC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta el secret MARC_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/marc-familiar-signing.jks
          chmod 600 android/marc-familiar-signing.jks
      - name: Compila la versió debug
        env:
          MARC_SIGNING_PASSWORD: ${{ secrets.MARC_SIGNING_PASSWORD }}
          MARC_SIGNING_ALIAS: ${{ secrets.MARC_SIGNING_ALIAS }}
          MARC_SIGNING_KEY_PASSWORD: ${{ secrets.MARC_SIGNING_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$MARC_SIGNING_PASSWORD" ] || [ -z "$MARC_SIGNING_ALIAS" ] || [ -z "$MARC_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Falten secrets de signatura de Marc Familiar."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Elimina el fitxer de clau temporal
        if: always()
        run: rm -f android/marc-familiar-signing.jks
      - name: Desa l'APK de prova
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marc-familiar-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
