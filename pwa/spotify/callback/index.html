<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Spotify · Marc Familiar</title><style>body{font:17px system-ui;background:#f5f6f1;color:#29283a;display:grid;place-items:center;min-height:100vh;margin:0;padding:18px}main{max-width:460px;background:white;border-radius:22px;padding:30px}p{line-height:1.5}</style></head><body><main><h1>♫ Spotify · Marc Familiar</h1><p id="status">Completant l'autorització…</p></main><script>
(async()=>{
const status=document.getElementById('status');
const params=new URLSearchParams(location.search),code=params.get('code'),state=params.get('state'),error=params.get('error');
history.replaceState(null,'','/spotify/callback');
const saved=sessionStorage.getItem('marc_spotify_oauth');sessionStorage.removeItem('marc_spotify_oauth');
if(error){status.textContent='Spotify no ha autoritzat la connexió: '+error;return;}
if(!saved||!code||!state){status.textContent='Per connectar Spotify, escaneja primer el QR del Marc Familiar.';return;}
try{
const auth=JSON.parse(saved);
if(state!==auth.state||Date.now()>auth.until)throw Error('El QR ha caducat o la sessió no coincideix.');
const data=new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:auth.redirectUri,client_id:auth.clientId,code_verifier:auth.verifier});
const response=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:data});
const token=await response.json();
if(!response.ok||!token.access_token||!token.refresh_token)throw Error('Spotify no ha retornat una autorització vàlida.');
const expiry=Date.now()+Number(token.expires_in||3600)*1000;
const relay=await fetch('/api/spotify-pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'publish',pair:auth.pair,until:auth.until,client_id:auth.clientId,access_token:token.access_token,refresh_token:token.refresh_token,expires_at:expiry})});
const result=await relay.json();
if(!relay.ok)throw Error(result.error||'No s’ha pogut enviar la vinculació al marc.');
status.textContent='Spotify autoritzat! Torna al Marc Familiar: es connectarà automàticament en uns segons.';
}catch(e){status.textContent='No s’ha pogut completar la vinculació: '+e.message;}
})();
</script></body></html>
